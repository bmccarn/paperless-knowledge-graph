name: Container Images

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: none
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: kg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kg_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      KG_ENV_FILE: ""
      REDIS_URL: memory://
      STRANDS_ENABLED: "false"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked backend dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Run offline behavior regressions
        run: python -m unittest discover -s tests -t . -v

      - name: Run disposable datastore behavior regressions
        env:
          NEO4J_TEST_URL: http://127.0.0.1:7474/db/neo4j/tx/commit
          NEO4J_TEST_BOLT: bolt://127.0.0.1:7687
          STORAGE_TEST_NEO4J: bolt://127.0.0.1:7687
          STORAGE_TEST_DSN: postgresql://postgres@127.0.0.1:5432/kg_test
          FEEDBACK_TEST_DSN: postgresql://postgres@127.0.0.1:5432/kg_test
          REDIS_TEST_URL: redis://127.0.0.1:6379/15
        run: python -m unittest discover -s tests -t . -v

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Check production advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Run graph regressions
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build

      - name: Set up Python for synthetic UI fixture
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Run production browser regressions
        run: npm run test:browser

  build:
    name: Build and push
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Build frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}-frontend:latest
