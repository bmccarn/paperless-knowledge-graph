name: Container Images

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: Generate approved screenshot baselines for this branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: none
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 127.0.0.1:7474:7474
          - 127.0.0.1:7687:7687
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: kg_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kg_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      KG_ENV_FILE: ""
      REDIS_URL: memory://
      STRANDS_ENABLED: "false"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked backend dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Run offline behavior regressions
        run: python -m unittest discover -s tests -t . -v

      - name: Run disposable datastore behavior regressions
        env:
          NEO4J_TEST_URL: http://127.0.0.1:7474/db/neo4j/tx/commit
          NEO4J_TEST_BOLT: bolt://127.0.0.1:7687
          NEO4J_TEST_URI: bolt://127.0.0.1:7687
          STORAGE_TEST_NEO4J: bolt://127.0.0.1:7687
          STORAGE_TEST_DSN: postgresql://postgres@127.0.0.1:5432/kg_test
          FEEDBACK_TEST_DSN: postgresql://postgres@127.0.0.1:5432/kg_test
          REDIS_TEST_URL: redis://127.0.0.1:6379/15
        run: python -m unittest discover -s tests -t . -v

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      UI_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      UI_BASELINE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines && '1' || '0' }}
      # Enable in the first PR after #111 merges, together with CI-generated baselines.
      UI_VISUAL_GATE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Check production advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Run graph regressions
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build

      - name: Set up Python for synthetic UI fixture
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Run production browser regressions
        run: npm run test:browser

      - name: Upload screenshot comparison and accessibility results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-comparison
          path: frontend/.browser-artifacts/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload CI-generated baselines
        if: always() && github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines
        uses: actions/upload-artifact@v7.0.2
        with:
          name: visual-baselines
          path: frontend/tests/baselines/
          if-no-files-found: error

  build:
    name: Build and push
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines) && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}

      - name: Build frontend
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}-frontend:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
